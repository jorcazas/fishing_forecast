# Unidades económicas (cooperativas pesqueras) y sus zonas TURF.
# Las coordenadas son placeholders hasta que COBI comparta los shapefiles oficiales.
# Soporta dos formatos por UE:
#   - bbox: {lon_min, lon_max, lat_min, lat_max}  (rápido, conservador)
#   - polygon: lista [lon, lat]                    (cuando esté disponible)

litoral_bc_sur:
  name: "LITORAL DE BAJA CALIFORNIA S DE PR DE RL"
  region: san_quintin
  bbox: &sq_bbox
    lon_min: -117.0
    lon_max: -115.0
    lat_min: 30.0
    lat_max: 31.5
  notes: |
    UE del paper original. Bbox cubre la zona costera de San Quintín.
    Pendiente: reemplazar por polígono TURF real cuando COBI comparta shapefile.

isla_cedros:
  name: "SCPP PESCADORES NACIONALES DE ABULON SC DE RL"
  region: vizcaino
  bbox:
    lon_min: -115.5
    lon_max: -114.8
    lat_min: 27.7
    lat_max: 28.4
  notes: |
    Cooperativa de abulón de Isla Cedros (oficina de arribo = ISLA CEDROS). Arribos:
    langosta roja (~576 t) + abulón azul (~175 t) 2017-2021. Bbox APROXIMADO alrededor de
    Isla Cedros; ~2.5° al sur de San Quintín → prueba el gradiente biogeográfico. Pendiente
    polígono TURF real. El nombre debe coincidir exacto con `unidad_economica` del crudo COBI.

# --- Clúster EL ROSARIO (~29.6-30.4°N), justo al sur de San Quintín ---
# Cooperativas con langosta roja cuya oficina de arribo es EL ROSARIO y cuya zona de captura
# (nombre_lugarcaptura del crudo COBI) cae en la costa de El Rosario: Bahía del Rosario, San
# Carlos, Punta San Antonio, El Socorro, Isla San Gerónimo. Comparten un mismo bbox costero
# (a resolución OISST/GlobColour el bbox basta; pendiente polígono TURF por cooperativa). Cada
# cooperativa es su propia UE (serie) pero comparte la oceanografía del bbox — más señal para
# el pooling (Exp 3.2). El bbox está dentro de la descarga Copernicus (lat 27-32, lon -117..-112.5).
er_scpp_ensenada:
  name: "SCPP ENSENADA SCL"
  region: el_rosario
  bbox: &el_rosario_bbox
    lon_min: -116.1
    lon_max: -115.3
    lat_min: 29.6
    lat_max: 30.4
  notes: "Langosta ~758 t 2017-2021 (mayor que la UE del paper). Captura: Bahía del Rosario, La Lobera."

er_mortera_leyva:
  name: "ASOCIACION PESQUERA MORTERA DE LEYVA SPR DE RL"
  region: el_rosario
  bbox: *el_rosario_bbox
  notes: "Langosta ~186 t. Captura: San Carlos, Campo Nuevo."

er_el_chute:
  name: "PESCADORES EL CHUTE SPR DE RL"
  region: el_rosario
  bbox: *el_rosario_bbox
  notes: "Langosta ~175 t. Captura: Valle Tranquilo, El Chute."

er_regasa:
  name: "SPR ASOCIACION PESQUERA REGASA NO 2 DE RL"
  region: el_rosario
  bbox: *el_rosario_bbox
  notes: "Langosta ~120 t. Captura: Punta San Antonio, Piedra San Antonio."

er_isla_san_geronimo:
  name: "ISLA SAN GERONIMO SPR DE RL"
  region: el_rosario
  bbox: *el_rosario_bbox
  notes: "Langosta ~93 t. Captura: El Socorro, El Chute (Isla San Gerónimo ~29.78°N)."

# --- Clúster costa-norte con historia completa 2017-2026 (COBI + CONAPESCA) ---
# Cooperativas de langosta roja presentes en AMBAS fuentes → misma profundidad de temporadas
# que San Quintín (~9), a diferencia de las de la península de Vizcaíno (solo CONAPESCA 2022+).
# El Pabellón y Rocas de San Martín están en la zona de San Quintín (~30.4-30.5°N) y comparten
# su bbox; Punta Canoas (~29.4°N) está ~1° al sur y tiene bbox propio. Todas dentro de la
# descarga Copernicus (lat 27-32, lon -117..-112.5). Nombres = `unidad_economica` exacto del crudo.
pabellon_sq:
  name: "EL PABELLON DE SAN QUINTIN SPR DE RL"
  region: san_quintin
  bbox: *sq_bbox
  notes: "Langosta roja, zona de San Quintín (~30.4°N). Comparte bbox con litoral_bc_sur."

rocas_san_martin:
  name: "ROCAS DE SAN MARTIN SPR DE RL"
  region: san_quintin
  bbox: *sq_bbox
  notes: "Langosta roja, Isla San Martín / San Quintín (~30.5°N). Comparte bbox con litoral_bc_sur."

punta_canoas:
  name: "SPR PUNTA CANOAS S DE RL DE CV"
  region: punta_canoas
  bbox:
    lon_min: -115.7
    lon_max: -114.9
    lat_min: 29.1
    lat_max: 29.8
  notes: "Langosta roja, Punta Canoas (~29.4°N), ~1° al sur de El Rosario. Historia 2017-2026."

# --- Clúster PENÍNSULA DE VIZCAÍNO (Punta Eugenia, ~27.1-27.9°N), solo CONAPESCA 2022+ ---
# Grandes productoras FEDECOOP de langosta roja (Panulirus interruptus), ~2° al sur de El Rosario
# y en el borde biogeográfico del Vizcaíno. Solo tienen historia CONAPESCA (2022-2026, ~4
# temporadas) → aportan AMPLITUD ESPACIAL al pool (más zonas de la misma especie), no profundidad
# temporal para San Quintín. Todas caen DENTRO de la descarga Copernicus actual (lat 27.02-31.98,
# lon -116.97..-112.53) → cero descargas nuevas. Nombres = `UNIDAD ECONOMICA` exacto del crudo
# CONAPESCA (verificado en cosecha_2022_2026). Tortugas/Emancipación/Natividad comparten bbox de
# Punta Eugenia (~27.7°N); Asunción tiene bbox propio ~0.7° al SE (~27.1°N, aguas más cálidas).
vizcaino_tortugas:
  name: "SCPP BAHIA TORTUGAS SC DE RL"
  region: vizcaino
  bbox: &vizcaino_pe_bbox
    lon_min: -115.3
    lon_max: -114.6
    lat_min: 27.5
    lat_max: 28.0
  notes: "Langosta roja ~767 t (mayor productora del pool). Bahía Tortugas (~27.68°N, -114.87°W)."

vizcaino_emancipacion:
  name: "SCPP EMANCIPACION SC DE RL"
  region: vizcaino
  bbox: *vizcaino_pe_bbox
  notes: "Langosta roja ~637 t. Punta Eugenia / Puerto Nuevo (~27.84°N, -115.08°W)."

vizcaino_natividad:
  name: "SCPP BUZOS Y PESCADORES DE LA BAJA CALIFORNIA SCL"
  region: vizcaino
  bbox: *vizcaino_pe_bbox
  notes: "Langosta roja ~362 t. Isla Natividad (~27.87°N, -115.17°W)."

vizcaino_asuncion:
  name: "SCPP LEYES DE REFORMA SC DE RL"
  region: vizcaino
  bbox:
    lon_min: -114.6
    lon_max: -113.9
    lat_min: 27.05
    lat_max: 27.45
  notes: "Langosta roja ~494 t. Bahía Asunción (~27.13°N, -114.29°W), ~0.7° al SE de Punta Eugenia."

# --- Clúster PACÍFICO BCS / Tier B (Punta Abreojos–La Purísima, ~26.2-27.0°N), solo CONAPESCA 2022+ ---
# Extiende el pool ~1° más al sur del clúster de Vizcaíno. Requirió ampliar la descarga Copernicus
# al sur (lat_min 25.8) y al este (lon_max -112.0) — ver copernicus_vars.yaml. Abreojos, La Bocana
# y San Hipólito comparten un bbox (~26.8°N); La Purísima/Punta Pequeña tiene bbox propio ~0.6° al
# SE (~26.2°N). Solo historia CONAPESCA (2022-2026). Nombres = `UNIDAD ECONOMICA` exacto del crudo.
abreojos_san_ignacio:
  name: "SCPP CALIFORNIA DE SAN IGNACIO SCL"
  region: pacifico_bcs
  bbox: &abreojos_bbox
    lon_min: -114.1
    lon_max: -113.4
    lat_min: 26.5
    lat_max: 27.1
  notes: "Langosta roja ~310 t. Punta San Hipólito / Laguna San Ignacio (~26.96°N, -113.96°W)."

abreojos_progreso:
  name: "SC PROGRESO DE PRODUCCION PESQUERA SC DE RL"
  region: pacifico_bcs
  bbox: *abreojos_bbox
  notes: "Langosta roja ~366 t. La Bocana (~26.79°N, -113.68°W)."

abreojos_punta:
  name: "SCPP PUNTA ABREOJOS SC DE RL"
  region: pacifico_bcs
  bbox: *abreojos_bbox
  notes: "Langosta roja ~408 t. Punta Abreojos (~26.71°N, -113.57°W)."

la_purisima:
  name: "SCPP LA PURISIMA SC DE RL"
  region: pacifico_bcs
  bbox:
    lon_min: -112.8
    lon_max: -112.1
    lat_min: 26.0
    lat_max: 26.5
  notes: "Langosta roja ~741 t (mayor productora del Tier B). Punta Pequeña / San Juanico (~26.24°N, -112.48°W)."

# --- Clúster BAHÍA MAGDALENA / Tier C (~24-25°N), solo CONAPESCA 2022+ ---
# Extremo sur del rango de la langosta roja (Panulirus interruptus), en el borde térmico cálido
# ~2° al sur del Tier B. Requirió ampliar la descarga Copernicus al sur (lat_min 24.0) y al este
# (lon_max -111.5) — ver copernicus_vars.yaml. La langosta roja se captura en la costa PACÍFICA
# externa de las islas barrera (Isla Magdalena, Isla Santa Margarita), no dentro de la bahía.
# Puerto San Carlos y Bahía Magdalena comparten el bbox de la costa externa de Isla Magdalena
# (~24.7°N); Puerto Chalé tiene bbox propio ~0.3° al sur (Isla Santa Margarita, ~24.4°N). Solo
# historia CONAPESCA (2022-2026). Nombres = `UNIDAD ECONOMICA` exacto del crudo CONAPESCA.
# Predomina la langosta AZUL (aguas cálidas); aquí solo se ingiere la ROJA (LANGOSTA ROJA ENT. FCA.).
magdalena_san_carlos:
  name: "SCPP PUERTO SAN CARLOS SCL"
  region: bahia_magdalena
  bbox: &magdalena_bbox
    lon_min: -112.4
    lon_max: -111.8
    lat_min: 24.4
    lat_max: 25.0
  notes: "Langosta roja ~37 t. Puerto San Carlos (~24.79°N, -112.11°W); captura en costa externa de Isla Magdalena."

magdalena_bahia:
  name: "SCPP BAHIA MAGDALENA SCL"
  region: bahia_magdalena
  bbox: *magdalena_bbox
  notes: "Langosta roja ~52 t. Puerto Magdalena / Isla Magdalena (~24.63°N, -112.14°W)."

magdalena_chale:
  name: "SCPP PUERTO CHALE SCL"
  region: bahia_magdalena
  bbox:
    lon_min: -112.2
    lon_max: -111.6
    lat_min: 24.1
    lat_max: 24.6
  notes: "Langosta roja ~118 t (mayor del Tier C). Puerto Chalé (~24.42°N, -111.55°W); captura en costa externa de Isla Santa Margarita."

# Pendientes: ENSENADA (~31.8°N): sin cooperativa de langosta significativa en los datos.
